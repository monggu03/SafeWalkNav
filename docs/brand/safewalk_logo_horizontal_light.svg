<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SafeWalk — Crosswalk safety for blind pedestrians">
  <title>SafeWalk 가로형 로고 (밝은 배경·인쇄용)</title>
  <desc>흰 배경 포스터·인쇄물용. 태그라인이 영문인 이유는 SF 부스 포스터를 염두에 뒀기 때문. 한글이 필요하면 text 를 바꾸면 된다.</desc>
  <defs>
    <radialGradient id="bgH" cx="38%" cy="28%" r="88%">
      <stop offset="0%" stop-color="#1C1F26"/><stop offset="100%" stop-color="#080A0D"/>
    </radialGradient>
    <filter id="glowH" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(40,36) scale(0.5625)">
    <rect width="512" height="512" rx="112" fill="#0E1116"/>
  <g fill="#FFD700">
    <rect x="150" y="404" width="212" height="20" rx="10" opacity="0.42"/>
    <rect x="122" y="438" width="268" height="21" rx="10.5" opacity="0.70"/>
    <rect x="92"  y="473" width="328" height="22" rx="11"/>
  </g>
    <g filter="url(#glowH)">
    <g fill="#00CC66" stroke="#00CC66" stroke-width="18" stroke-linejoin="round">
      <!-- 몸통: 어깨 넓고 골반 좁은 사다리꼴. 같은 색 stroke 로 모서리를 둥글린다. -->
      <path d="M246 196 L312 210 L288 306 L240 296 Z"/>
    </g>
    <g stroke="#00CC66" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 뒤로 스윙한 팔 / 뒤로 뻗은 다리 -->
      <path d="M252 218 L198 262" stroke-width="30"/>
      <path d="M248 302 L200 352 L154 394" stroke-width="36"/>
      <!-- 앞으로 스윙한 팔 / 앞으로 내딛는 다리 -->
      <path d="M302 218 L358 240" stroke-width="30"/>
      <path d="M272 304 L322 354 L338 408" stroke-width="36"/>
    </g>
    <circle cx="278" cy="134" r="43" fill="#00CC66"/>
    </g>
  </g>
  <g font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="380" y="196" font-size="132" font-weight="800" letter-spacing="-3">
      <tspan fill="#0E1116">Safe</tspan><tspan fill="#00A855">Walk</tspan>
    </text>
    <text x="386" y="256" font-size="38" font-weight="600" fill="#5A6472" letter-spacing="0.5">Crosswalk safety for blind pedestrians</text>
  </g>
</svg>
