<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SafeWalk 적응형 아이콘 전경 레이어">
  <title>SafeWalk adaptive icon foreground</title>
  <desc>
    Android 적응형 아이콘(mipmap-anydpi-v26)의 전경 레이어. 배경은 drawable/ic_launcher_background 가 담당하므로
    여기엔 배경을 넣지 않는다. 런처가 원형·둥근사각형 등으로 마스킹하므로 내용을 안전 영역(중앙 약 62%)에 몰아 넣었다.
  </desc>
  <defs>
    <filter id="glowF" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 아트의 시각 중심(256,293)을 캔버스 중심으로 옮기고 안전 영역까지 축소 -->
  <g transform="translate(256,256) scale(0.62) translate(-256,-293)">
  <g fill="#FFD700">
    <rect x="150" y="404" width="212" height="20" rx="10" opacity="0.42"/>
    <rect x="122" y="438" width="268" height="21" rx="10.5" opacity="0.70"/>
    <rect x="92"  y="473" width="328" height="22" rx="11"/>
  </g>
    <g filter="url(#glowF)">
    <g fill="#00CC66" stroke="#00CC66" stroke-width="18" stroke-linejoin="round">
      <!-- 몸통: 어깨 넓고 골반 좁은 사다리꼴. 같은 색 stroke 로 모서리를 둥글린다. -->
      <path d="M246 196 L312 210 L288 306 L240 296 Z"/>
    </g>
    <g stroke="#00CC66" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 뒤로 스윙한 팔 / 뒤로 뻗은 다리 -->
      <path d="M252 218 L198 262" stroke-width="30"/>
      <path d="M248 302 L200 352 L154 394" stroke-width="36"/>
      <!-- 앞으로 스윙한 팔 / 앞으로 내딛는 다리 -->
      <path d="M302 218 L358 240" stroke-width="30"/>
      <path d="M272 304 L322 354 L338 408" stroke-width="36"/>
    </g>
    <circle cx="278" cy="134" r="43" fill="#00CC66"/>
    </g>
  </g>
</svg>
